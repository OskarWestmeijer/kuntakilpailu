<!doctype html>
<html lang="fi" data-theme="customtheme">
	<head>
		<meta charset="utf-8" />
		<!--
		Sets the real data-theme before the rest of <head>/<body> is parsed, so the page never
		flashes the wrong theme. Without an explicit data-theme, DaisyUI's *own* built-in dark
		theme would auto-activate under prefers-color-scheme: dark via
		`:root:not([data-theme])` — leaving <html> pinned to a known theme (light by default,
		here overwritten to the stored/system choice) opts the page out of that entirely and
		hands theme selection to ThemeToggle.svelte + this script instead. See app.css for the
		two theme blocks (customtheme / customtheme-dark).
	-->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('kuntakilpailu-theme');
					var theme =
						stored === 'customtheme' || stored === 'customtheme-dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'customtheme-dark'
								: 'customtheme';

					document.documentElement.setAttribute('data-theme', theme);
				} catch (e) {}

				// Same trick for the language: the page is prerendered in Finnish, so an English
				// reader would otherwise see Finnish copy until hydration swapped it. `i18n.svelte.ts`
				// reads this attribute back rather than reading storage a second time, so the two
				// cannot disagree.
				try {
					if (localStorage.getItem('kuntakilpailu-lang') === 'en') {
						document.documentElement.lang = 'en';
					}
				} catch (e) {}
			})();
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta
			name="description"
			content="Compare all 308 Finnish municipalities on one score, built from unemployment, population change, income, education, age and gender balance."
		/>
		<meta
			name="keywords"
			content="Finland, kunta, kuntavertailu, municipalities, statistics, Tilastokeskus, unemployment, income, education, map"
		/>
		<meta name="author" content="Oskar Westmeijer" />
		<meta name="robots" content="index, follow" />
		<title>Kuntakilpailu | Finnish municipality comparison</title>

		<!-- Umami analytics. data-domains keeps localhost/e2e runs out of the stats. -->
		<script
			defer
			src="https://umami.oskar-westmeijer.com/script.js"
			data-website-id="0b09d553-1e8d-491d-91ba-cbb98939fdbd"
			data-domains="kuntakilpailu.oskar-westmeijer.com"
		></script>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
